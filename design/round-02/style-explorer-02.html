/* 并排与单张之间、视口与筛选变化用页面过渡：同一方向的画面从卡片放大到单张，其他卡片淡出，侧栏从右侧滑入 */
::view-transition-group(*){animation-duration:var(--glide-d);animation-timing-function:var(--glide)}
::view-transition-old(*),::view-transition-new(*){height:100%;object-fit:cover;object-position:50% 0}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both}
::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}
::view-transition-new(info):only-child{animation:info-in var(--glide-d) var(--glide) both}
::view-transition-old(info):only-child{animation:info-out .22s var(--exit) both}
::view-transition-old(bar){display:none}::view-transition-new(bar){animation:none}
/* 视口、筛选、说明开关和缩放只改变形状与位置：外框直接变形，内容不做叠影 */
html[data-vt=reshape]::view-transition-old(*){animation:none;opacity:0}
html[data-vt=reshape]::view-transition-new(*){animation:none}
html[data-vt=reshape]::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both;opacity:1}
html[data-vt=reshape]::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}

gFang SC\", sans-serif;\n  }\n  * { margin: 0; padding: 0; box-sizing: border-box; }\n  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 13.5px; line-height: 1.6; -webkit-font-smoothing: antialiased; }\n\n  /* 顶部：一行细状态条，不抢戏 */\n  .top {\n    display: flex; align-items: center; gap: 18px;\n    padding: 10px 28px; border-bottom: 1px solid var(--line); background: #fff;\n  }\n  .brand { font-weight: 700; font-size: 14px; }\n  .brand i { font-style: normal; color: var(--amber); margin-right: 6px; }\n  .stats { display: flex; gap: 16px; font-size: 12px; color: var(--ink-2); }\n  .stats b { font-family: var(--mono); font-weight: 700; color: var(--ink); }\n  .top .sys { margin-left: auto; font-size: 12px; color: var(--ink-3); }\n  .top .sys b { color: var(--green); font-weight: 400; }\n\n  .wrap { max-width: 860px; margin: 0 auto; padding: 26px 24px 48px; }\n\n  /* 今日总额 */\n  .today { display: flex; align-items: baseline; gap: 14px; }\n  .today h1 { font-size: 26px; font-weight: 700; letter-spacing: 0.01em; }\n  .today h1 b { font-family: var(--mono); }\n  .today .sub { color: var(--ink-2); font-size: 13px; }\n  .chips { margin-top: 10px; display: flex; gap: 8px; }\n  .chip { font-size: 12px; padding: 3px 10px; border-radius: 20px; background: var(--amber-bg); color: var(--amber); font-weight: 700; }\n  .chip.quiet { background: #eef1f4; color: var(--ink-2); font-weight: 400; }\n\n  /* 分组 */\n  section { margin-top: 34px; }\n  .sec-h { display: flex; align-items: baseline; gap: 10px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }\n  .sec-h h2 { font-size: 15px; font-weight: 700; }\n  .sec-h .n { font-family: var(--mono); font-weight: 700; color: var(--amber); }\n  .sec-h .hint { margin-left: auto; font-size: 12px; color: var(--ink-3); }\n\n  /* 清单行：对象与动作挨在一起 */\n  .row {\n    display: flex; align-items: center; gap: 14px;\n    padding: 12px 4px; border-bottom: 1px solid var(--line);\n  }\n  .row:hover { background: #f5f7f9; }\n  .row .mark { flex: none; width: 18px; height: 18px; border: 1.5px solid var(--ink-3); border-radius: 4px; }\n  .row.done .mark { border-color: var(--green); background: var(--green); position: relative; }\n  .row.done .mark::after { content: \"✓\"; position: absolute; inset: 0; color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; }\n  .row .body { flex: 1; min-width: 0; }\n  .row .body b { display: block; font-size: 14px; font-weight: 700; line-height: 1.45; }\n  .row .body small { display: block; color: var(--ink-2); font-size: 12px; margin-top: 1px; }\n  .row .body small .m { font-family: var(--mono); }\n  .lay {\n    flex: none; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em;\n    color: var(--ink-2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px;\n  }\n  .acts { flex: none; display: flex; gap: 8px; }\n  .btn {\n    font-size: 12.5px; font-weight: 700; padding: 5px 14px; border-radius: 6px;\n    border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; font-family: var(--sans);\n  }\n  .btn:hover { border-color: var(--ink-2); }\n  .btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }\n  .btn.primary:hover { background: #343a41; }\n  .btn.link { border: none; background: none; color: var(--ink-2); font-weight: 400; text-decoration: underline; text-underline-offset: 3px; }\n\n  /* 已处理：沉降划线 */\n  .row.done { opacity: 0.55; }\n  .row.done .body b { text-decoration: line-through; text-decoration-thickness: 1px; font-weight: 400; }\n  .row.done .acts { display: none; }\n  .row.done .when { font-family: var(--mono); font-size: 11.5px; color: var(--green); font-weight: 700; }\n\n  /* 失败行 */\n  .row.fail .mark { border-radius: 50%; border-color: var(--amber); background: var(--amber-bg); }\n  .row.fail .body b::after { content: \"失败 · 修复循环 3/3 轮\"; font-size: 11px; font-weight: 700; color: var(--amber); margin-left: 10px; }\n\n  /* 空闲 u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"row\">\n        \u003cspan class=\"mark\">\u003c/span>\u003cspan class=\"lay\">UT\u003c/span>\n        \u003cspan class=\"body\">\u003cb>validate_remote_url：拒绝内网地址与非常规协议\u003c/b>\u003csmall>validate_remote_url · 10 断言 · 覆盖 28.6% · 生成于 09:12\u003c/small>\u003c/span>\n        \u003cspan class=\"acts\">\u003cbutton class=\"btn link\">预览\u003c/button>\u003cbutton class=\"btn\">打回\u003c/button>\u003cbutton class=\"btn primary\">通过入库\u003c/button>\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"row\">\n        \u003cspan class=\"mark\">\u003c/span>\u003cspan class=\"lay\">UT\u003c/span>\n        \u003cspan class=\"body\">\u003cb>tokenize：空串与连续分隔符的边界\u003c/b>\u003csmall>tokenize · 9 断言 · 覆盖 10.6% · 生成于 09:11\u003c/small>\u003c/span>\n        \u003cspan class=\"acts\">\u003cbutton class=\"btn link\">预览\u003c/button>\u003cbutton class=\"btn\">打回\u003c/button>\u003cbutton class=\"btn primary\">通过入库\u003c/button>\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"row done\">\n        \u003cspan class=\"mark\">\u003c/span>\u003cspan class=\"lay\">UT\u003c/span>\n        \u003cspan class=\"body\">\u003cb>short_code：长度 8 与自定义字母表\u003c/b>\u003csmall>short_code · 9 断言\u003c/small>\u003c/span>\n        \u003cspan class=\"when\">09:38 通过入库\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"row done\">\n        \u003cspan class=\"mark\">\u003c/span>\u003cspan class=\"lay\">UT\u003c/span>\n        \u003cspan class=\"body\">\u003cb>verify_password：空口令直接拒绝\u003c/b>\u003csmall>verify_password · 4 断言\u003c/small>\u003c/span>\n        \u003cspan class=\"when\">09:36 通过入库\u003c/span>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cdiv class=\"sec-h\">\u003ch2>跟进失败与缺陷\u003c/h2>\u003cspan class=\"n\">21\u003c/span>\u003cspan class=\"hint\">失败自动建档 · 全链路可追溯\u003c/span>\u003c/div>\n      \u003cdiv class=\"row fail\">\n        \u003cspan class=\"mark\">\u003c/span>\u003cspan class=\"lay\">API\u003c/span>\n        \u003cspan class=\"body\">\u003cb>web-api 下单链路 · 第 6 例（库存校验）\u003c/b>\u003csmall>5/6 例通过 · 修复循环 3 轮未过 · traceID 9f2c…e81\u003c/small>\u003c/span>\n        \u003cspan class=\"acts\">\u003cbutton class=\"btn link\">执行日志\u003c/button>\u003cbutton class=\"btn\">派单修复\u003c/button>\u003cbutton class=\"btn primary\">去处理\u003c/button>\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"idle\">\u003cspan>其余 20 个缺陷按服务分组在 \u003cb>缺陷\u003c/b> 页跟进，无新失败。\u003c/span>\u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003cdiv class=\"sec-h\">\u003ch2>需求与队列\u003c/h2>\u003cspan class=\"hint\">当前空闲\u003c/span>\u003c/div>\n      \u003cdiv class=\"idle\">\u003cspan>需求 \u003cb>1\u003c/b> 条已全部处理 · 任务队列空闲 · 无待回归用例\u003c/span>\u003c/div>\n    \u003c/section>\n\n    \u003cfooter>\u003cspan>数据实时 · 15 秒自动刷新\u003c/span>\u003cspan>处理记录全链路追溯 · traceID 账本\u003c/span>\u003c/footer>\n  \u003c/div>\n\u003c/body>\n\u003c/html>\n", "sourceLabel": "1-checklist.html", "baseline": false, "interactive": false}, {"id": "2-review-desk", "name": "2 · 审阅台", "concept": "把人审做成工作台：当前对象和动作挨在一起——左队列、中央用例正文给足排版、右动作栏，39 条草稿一条条过", "typography": "需求原文用宋体引文块（人话归纸面）、界面雅黑、断言与数字等宽——三种文字各司其职", "palette": ["#faf8f3", "#262b33", "#2b6cb0"], "traits": ["三栏审阅工作台，中央阅读区是主角", "需求引文宋体 + 断言深色代码块", "相似用例 RAG 提示与追溯链入栏", "快捷键 J/K/P/X 支持逐条过审"], "kind": "html", "content": "\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'\">\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>TestForge · 审阅台\u003c/title>\n\u003cstyle>\n  :root {\n    --bg: #faf8f3;\n    --paper: #fffdf8;\n    --ink: #262b33;\n    --ink-2: #5d6570;\n    --ink-3: #98a0ab;\n    --line: #e6e1d4;\n    --indigo: #2b6cb0;\n    --indigo-deep: #1e4e85;\n    --red: #b03a2e;\n    --mono: Consolas, \"Courier New\", monospace;\n    --sans: \"Microsoft YaHei\", \"PingFang SC\", sans-serif;\n    --song: \"SimSun\", \"NSimSun\", serif;\n  }\n  * { margin: 0; padding: 0; box-sizing: border-box; }\n  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 13.5px; line-height: 1.65; -webkit-font-smoothing: antialiased; }\n\n  .top {\n    display: flex; align-items: center; gap: 16px; padding: 9px 24px;\n    border-bottom: 1px solid var(--line); background: var(--paper);\n  }\n  .brand { font-weight: 700; font-size: 14px; }\n  .brand i { font-style: normal; color: var(--indigo); margin-right: 6px; }\n  .crumb { color: var(--ink-2); font-size: 12.5px; }\n  .top .sys { margin-left: auto; font-size: 12px; color: var(--ink-3); }\n  .top .sys b { color: #2e7d4f; font-weight: 400; }\n\n  .desk { display: grid; grid-template-columns: 232px 1fr 232px; min-height: calc(100vh - 42px); }\n\n  /* —— 左：今日队列 —— */\n  .queue { border-right: 1px solid var(--line); padding: 16px 0 20px; background: var(--paper); }\n  .queue h3 { font-size: 12px; letter-spacing: 0.14em; color: var(--ink-2); padding: 0 18px 10px; }\n  .queue h3 b { font-family: var(--mono); color: var(--ink); }\n  .qitem { display: block; padding: 9px 18px; border-left: 3px solid transparent; color: inherit; text-decoration: none; }\n  .qitem:hover { background: #f4f0e6; }\n  .qitem.on { border-left-color: var(--indigo); background: #f2ede0; }\n  .qitem b { display: block; font-size: 12.8px; font-weight: 700; line-height: 1.5; }\n  .qitem small { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }\n  .qitem small .m { font-family: var(--mono); }\n  .qfoot { margin-top: 14px; padding: 12px 18px 0; border-top: 1px dashed var(--line); font-size: 12px; color: var(--ink-2); }\n  .qfoot .bar { height: 5px; background: #eae4d5; border-radius: 3px; margin: 7px 0 5px; overflow: hidden; }\n  .qfoot .bar i { display: block; height: 100%; width: 10%; background: var(--indigo); }\n  .qfoot .m { font-family: var(--mono); }\n\n  /* —— 中：用例正文（阅读是主角） —— */\n  .reading { padding: 30px 44px 44px; max-width: 760px; }\n  .reading .crumbs { font-size: 12px; color: var(--ink-3); letter-spacing: 0.04em; }\n  .reading .crumbs b { color: var(--indigo); font-weight: 400; }\n  .reading h1 { font-size: 22px; font-weight: 700; line-height: 1.5; margin: 8px 0 4px; }\n  .meta { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); padding-bottom: 14px; border-bottom: 1px solid var(--line); }\n  .meta .m { font-family: var(--mono); }\n\n  .quote {\n    margin: 18px 0 0; padding: 13px 18px; border-left: 3px solid var(--ink-3);\n    background: #f4f0e6;\n  }\n  .quote h4 { font-size: 11.5px; letter-spacing: 0.18em; color: var(--ink-2); margin-bottom: 5px; font-weight: 700; }\n  .quote p { font-family: var(--song); font-size: 14.5px; line-height: 1.9; color: #3a3f47; }\n\n  .reading h3 { font-size: 14px; font-weight: 700; margin: 24px 0 8px; letter-spacing: 0.02em; }\n  .reading h3 .no { color: var(--ink-3); font-family: var(--mono); font-weight: 400; margin-right: 8px; }\n  .reading p { font-size: 13.8px; line-height: 1.85; color: #333a42; }\n\n  pre {\n    font-family: var(--mono); font-size: 12.5px; line-height: 1.75;\n    background: #2b3138; color: #dfe6ee; border-radius: 8px;\n    padding: 14px 18px; overflow-x: auto; margin: 8px 0 4px;\n  }\n  pre .k { color: #8ab4e8; } pre .s { color: #a8d8a0; } pre .c { color: #7d8894; }\n\n  .sim {\n    margin-top: 22px; border: 1px dashed var(--line); border-radius: 8px; padding: 11px 16px;\n    font-size: 12.5px; color: var(--ink-2); background: var(--paper);\n  }\n  .sim b { color: var(--ink); font-weight: 700; }\n  .sim .m { font-family: var(--mono); }\n\n  /* —— 右：动作 —— */\n  .actions { border-left: 1px solid var(--line); padding: 20px 18px; background: var(--paper); }\n  .actions h3 { font-size: 12px; letter-spacing: 0.14em; color: var(--ink-2); margin-bottom: 12px; }\n  .abtn {\n    display: block; width: 100%; text-align: center; padding: 10px 0; margin-bottom: 10px;\n    border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: var(--sans);\n  }\n  .abtn.pass { background: var(--indigo); color: #fff; border: 1px solid var(--indigo-deep); }\n  .abtn.pass:hover { background: var(--indigo-deep); }\n  .abtn.rej { background: #fff; color: var(--red); border: 1px solid #e2c8c4; }\n  .abtn.rej:hover { background: #faf0ee; }\n  .abtn.bug { background: #fff; color: var(--ink); border: 1px solid var(--line); }\n  .abtn small { display: block; font-size: 11px; font-weight: 400; opacity: 0.75; margin-top: 1px; }\n  .note-box { margin-top: 18px; }\n  .note-box h4 { font-size: 12px; color: var(--ink-2); margin-bottom: 7px; }\n  .note-box textarea {\n    width: 100%; height: 88px; resize: none; border: 1px solid var(--line); border-radius: 8px;\n    background: #fff; padding: 9px 11px; font-family: var(--sans); font-size: 12.5px; color: var(--ink);\n  }\n  .keys { margin-top: 16px; font-size: 11.5px; color: var(--ink-3); line-height: 2; }\n  .keys kbd {\n    font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--line); border-bottom-width: 2px;\n    border-radius: 4px; padding: 0 5px; background: #fff; color: var(--ink-2); margin-right: 4px;\n  }\n  .trace { margin-top: 20px; padding-top: 14px; border-top: 1px dashed var(--line); font-size: 11.5px; color: var(--ink-3); line-height: 1.9; }\n  .trace .m { font-family: var(--mono); }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cheader class=\"top\">\n    \u003cspan class=\"brand\">\u003ci>▣\u003c/i>TestForge · 审阅台\u003c/span>\n    \u003cspan class=\"crumb\">人审草稿用例 · 今天第 5 / 39 条\u003c/span>\n    \u003cspan class=\"sys\">服务 \u003cb>8/8 全绿\u003c/b> · MONO · 09:30\u003c/span>\n  \u003c/header>\n\n  \u003cdiv class=\"desk\">\n    \u003caside class=\"queue\">\n      \u003ch3>今日队列 · \u003cb>4/39\u003c/b> 已审\u003c/h3>\n      \u003ca class=\"qitem\" href=\"#\">\u003cb>short_code：长度 8 与自定义字母表\u003c/b>\u003csmall>\u003cspan class=\"m\">UT\u003c/span> · short_code · 9 断言\u003c/small>\u003c/a>\n      \u003ca class=\"qitem on\" href=\"#\">\u003cb>verify_password：连续错误 5 次触发锁定\u003c/b>\u003csmall>\u003cspan class=\"m\">UT\u003c/span> · verify_password · 11 断言\u003c/small>\u003c/a>\n      \u003ca class=\"qitem\" href=\"#\">\u003cb>validate_remote_url：拒绝内网地址\u003c/b>\u003csmall>\u003cspan class=\"m\">UT\u003c/span> · validate_remote_url · 10 断言\u003c/small>\u003c/a>\n      \u003ca class=\"qitem\" href=\"#\">\u003cb>tokenize：空串与连续分隔符\u003c/b>\u003csmall>\u003cspan class=\"m\">UT\u003c/span> · tokenize · 9 断言\u003c/small>\u003c/a>\n      \u003ca class=\"qitem\" href=\"#\">\u003cb>tokenize：中英混排切分\u003c/b>\u003csmall>\u003cspan class=\"m\">UT\u003c/span> · tokenize · 7 断言\u003c/small>\u003c/a>\n      \u003ca class=\"qitem\" href=\"#\">\u003cb>verify_password：空口令直接拒绝\u003c/b>\u003csmall>\u003cspan class=\"m\">UT\u003c/span> · verify_password · 4 断言\u003c/small>\u003c/a>\n      \u003cdiv class=\"qfoot\">\n        队列进度\n        \u003cdiv class=\"bar\">\u003ci>\u003c/i>\u003c/div>\n        \u003cspan class=\"m\">4 / 39\u003c/span> · 预计 25 分钟过完\n      \u003c/div>\n    \u003c/aside>\n\n    \u003cmain class=\"reading\">\n      \u003cdiv class=\"crumbs\">草稿 · \u003cb>UT 层\u003c/b> · 函数级管线 · traceID \u003cspan style=\"font-family:var(--mono)\">9f2c…e81\u003c/span>\u003c/div>\n      \u003ch1>verify_password：连续错误 5 次触发锁定\u003c/h1>\n      \u003cdiv class=\"meta\">\n        \u003cspan>目标函数 \u003cb class=\"m\">verify_password\u003c/b>\u003c/span>\n        \u003cspan>断言 \u003cb class=\"m\">11\u003c/b> 个\u003c/span>\n        \u003cspan>预估覆盖 \u003cb class=\"m\">30.0%\u003c/b>\u003c/span>\n        \u003cspan>生成于 09:12 · 两阶段\u003c/span>\n        \u003cspan>沙箱试跑 \u003cb class=\"m\">11/11 通过\u003c/b>\u003c/span>\n      \u003c/div>\n\n      \u003cdiv class=\"quote\">\n        \u003ch4>对应需求原文\u003c/h4>\n        \u003cp>作为用户，我希望连续输错口令时账户被临时锁定，以免被人暴力尝试；锁定期间即使口令正确也应拒绝，等待冷却后自动解锁。\u003c/p>\n      \u003c/div>\n\n      \u003ch3>\u003cspan class=\"no\">01\u003c/span>设计说明\u003c/h3>\n      \u003cp>围绕锁定阈值 5 次与冷却窗口展开：第 5 次失败触发锁定，锁定态下正确口令同样被拒；冷却经过后恢复。同时对大小写与前后空白做规范化断言，防止绕过计数。\u003c/p>\n\n      \u003ch3>\u003cspan class=\"no\">02\u003c/span>关键断言\u003c/h3>\n      \u003cpre>\u003cspan class=\"c\"># 锁定阈值与冷却窗口\u003c/span>\n\u003cspan class=\"k\">assert\u003c/span> locked_after(5) \u003cspan class=\"k\">is\u003c/span> True\n\u003cspan class=\"k\">assert\u003c/span> verify(\u003cspan class=\"s\">\"Right-Pass1\"\u003c/span>, locked=\u003cspan class=\"k\">True\u003c/span>).rejected\n\u003cspan class=\"k\">assert\u003c/span> verify(\u003cspan class=\"s\">\"Right-Pass1\"\u003c/span>, cooldown=\u003cspan class=\"k\">True\u003c/span>).accepted\n\u003cspan class=\"k\">assert\u003c/span> counter_not_reset_by_case(\u003cspan class=\"s\">\"wrong-pass\"\u003c/span>, \u003cspan class=\"s\">\"WRONG-PASS \"\u003c/span>)\u003c/pre>\n\n      \u003ch3>\u003cspan class=\"no\">03\u003c/span>覆盖与缺口\u003c/h3>\n      \u003cp>已覆盖阈值边界与冷却恢复；\u003cb>未覆盖\u003c/b>分布式计数（多会话共享锁定态）——该场景需要接口层用例，建议转入 API 层管线。\u003c/p>\n\n      \u003cdiv class=\"sim\">相似用例提示：与已入库的 \u003cb>《verify_password 重试计数规范化》\u003c/b> 相似度 \u003cb class=\"m\">82%\u003c/b>，注意断言是否重复。\u003c/div>\n    \u003c/main>\n\n    \u003caside class=\"actions\">\n      \u003ch3>审阅动作\u003c/h3>\n      \u003cbutton class=\"abtn pass\">通过入库\u003csmall>快捷键 P · 计入用例库\u003c/small>\u003c/button>\n      \u003cbutton class=\"abtn rej\">打回重生成\u003csmall>写明原因 · AI 按批注重跑\u003c/small>\u003c/button>\n      \u003cbutton class=\"abtn bug\">转入缺陷 / API 层\u003csmall>未覆盖场景转接口管线\u003c/small>\u003c/button>\n\n      \u003cdiv class=\"note-box\">\n        \u003ch4>审阅批注\u003c/h4>\n        \u003ctextarea placeholder=\"留给 AI 或下一位审阅人：比如『阈值应读配置而非硬编码』\">\u003c/textarea>\n      \u003c/div>\n\n      \u003cdiv class=\"keys\">\n        \u003ckbd>J\u003c/kbd>/\u003ckbd>K\u003c/kbd> 上一条 / 下一条\u003cbr>\n        \u003ckbd>P\u003c/kbd> 通过 · \u003ckbd>X\u003c/kbd> 打回\u003cbr>\n        \u003ckbd>Enter\u003c/kbd> 展开沙箱日志\n      \u003c/div>\n\n      \u003cdiv class=\"trace\">\n        追溯链：需求 → 契约 → 生成 → 试跑 11/11\u003cbr>\n        相似库比对 \u003cspan class=\"m\">82%\u003c/span> · 上下文 \u003cspan class=\"m\">18.4k\u003c/span> tokens\n      \u003c/div>\n    \u003c/aside>\n  \u003c/div>\n\u003c/body>\n\u003c/html>\n", "sourceLabel": "2-review-desk.html", "baseline": false, "interactive": false}, {"id": "3-signal-board", "name": "3 · 值班信号板", "concept": "值班室状态板：失败永远排第一，通过按时间倒序，界面近乎无彩——颜色全部交给状态，失败一眼跳出", "typography": "雅黑界面 + 42px 等宽大数字：数字是画面的量，不只是标签", "palette": ["#f4f6f5", "#172026", "#d92d20"], "traits": ["左缘信号灯条 + 状态底色，红排第一", "近乎无彩 UI，红绿琥珀只给状态", "今日执行时间线：失败在轴上标红点", "大数字行：通过率 51.2% 用红色承担警示"], "kind": "html", "content": "\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'\">\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>TestForge · 值班信号板\u003c/title>\n\u003cstyle>\n  :root {\n    --bg: #f4f6f5;\n    --panel: #ffffff;\n    --ink: #172026;\n    --ink-2: #55616b;\n    --ink-3: #8b97a1;\n    --line: #dfe5e3;\n    --red: #d92d20;\n    --red-bg: #fef1f0;\n    --green: #067647;\n    --green-bg: #eefaf3;\n    --amber: #b54708;\n    --amber-bg: #fdf4e7;\n    --mono: Consolas, \"Courier New\", monospace;\n    --sans: \"Microsoft YaHei\", \"PingFang SC\", sans-serif;\n  }\n  * { margin: 0; padding: 0; box-sizing: border-box; }\n  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 13.5px; line-height: 1.6; -webkit-font-smoothing: antialiased; }\n\n  .top { display: flex; align-items: center; gap: 16px; padding: 11px 26px; background: var(--panel); border-bottom: 1px solid var(--line); }\n  .brand { font-weight: 700; font-size: 14px; }\n  .brand i { font-style: normal; margin-right: 6px; }\n  .top .clock { font-family: var(--mono); font-size: 15px; font-weight: 700; letter-spacing: 0.06em; }\n  .top .sys { margin-left: auto; font-size: 12px; color: var(--ink-2); }\n  .top .sys b { color: var(--green); font-weight: 400; }\n\n  .wrap { max-width: 1060px; margin: 0 auto; padding: 24px 26px 50px; }\n\n  /* —— 信号区：状态是唯一的主角 —— */\n  .board-h { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }\n  .board-h h1 { font-size: 19px; font-weight: 700; }\n  .board-h span { color: var(--ink-2); font-size: 12.5px; }\n\n  .signal { display: flex; align-items: stretch; background: var(--panel); border: 1px solid var(--line); border-left: none; margin-bottom: 8px; }\n  .signal .lamp { width: 7px; flex: none; }\n  .signal.ok .lamp { background: var(--green); }\n  .signal.bad .lamp { background: var(--red); }\n  .signal.idle .lamp { background: var(--amber); }\n  .signal .sbody { flex: 1; display: flex; align-items: center; gap: 16px; padding: 13px 18px; min-width: 0; }\n  .signal.bad { background: var(--red-bg); }\n  .signal .sbody .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; flex: none; }\n  .signal.ok .tag { color: var(--green); }\n  .signal.bad .tag { color: var(--red); }\n  .signal.idle .tag { color: var(--amber); }\n  .signal .name { flex: 1; min-width: 0; }\n  .signal .name b { display: block; font-size: 14px; font-weight: 700; line-height: 1.4; }\n  .signal .name small { display: block; color: var(--ink-2); font-size: 12px; }\n  .signal .name small .m { font-family: var(--mono); }\n  .signal .num { flex: none; font-family: var(--mono); font-size: 26px; font-weight: 700; text-align: right; line-height: 1; }\n  .signal.ok .num { color: var(--green); }\n  .signal.bad .num { color: var(--red); }\n  .signal .num small { display: block; font-size: 10.5px; color: var(--ink-3); font-weight: 400; letter-spacing: 0.1em; margin-top: 4px; }\n  .signal .go { flex: none; font-size: 12.5px; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; align-self: center; }\n  .signal.bad .go { color: var(--red); font-weight: 700; }\n\n  /* —— 大数字行：量画出来 —— */\n  .figures { display: flex; margin-top: 26px; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--line); background: var(--panel); }\n  .fig { flex: 1; padding: 16px 20px 14px; border-left: 1px solid var(--line); }\n  .fig:first-child { border-left: none; }\n  .fig .v { font-family: var(--mono); font-size: 42px; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; }\n  .fig .v small { font-size: 15px; color: var(--ink-3); font-weight: 400; margin-left: 4px; }\n  .fig.warn .v { color: var(--red); }\n  .fig.care .v { color: var(--amber); }\n  .fig .l { display: block; font-size: 12.5px; color: var(--ink-2); margin-top: 6px; }\n\n  /* —— 今日时间线 —— */\n  .tl { margin-top: 28px; }\n  .tl h3 { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; margin-bottom: 14px; color: var(--ink); }\n  .track { position: relative; height: 3px; background: var(--line); margin: 8px 6px 0; }\n  .track .dot { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 11px; height: 11px; border-radius: 50%; background: var(--green); border: 2.5px solid var(--bg); box-shadow: 0 0 0 1px var(--green); }\n  .track .dot.bad { background: var(--red); box-shadow: 0 0 0 1px var(--red); width: 13px; height: 13px; }\n  .tl .labels { position: relative; height: 54px; margin: 10px 6px 0; }\n  .tl .lab { position: absolute; transform: translateX(-50%); text-align: center; width: 130px; }\n  .tl .lab .m { font-family: var(--mono); font-size: 11px; color: var(--ink-3); display: block; }\n  .tl .lab span { font-size: 11.5px; color: var(--ink-2); display: block; line-height: 1.5; }\n  .tl .lab b { color: var(--ink); font-weight: 700; }\n\n  .todo-strip { display: flex; gap: 8px; margin-top: 24px; }   try{await fetch(target.href,{mode:'no-cors',cache:'no-store',credentials:'omit',signal:controller.signal});state.ready=true;}catch{state.ready=false;}
  finally{clearTimeout(timer);state.pending=false;}
  $$('.stage').forEach(s=>{const c=byId[s.dataset.id];if(c.kind==='url'&&c.content===url)syncService(s,c);});
 }
 const checkServices=()=>services.forEach((state,url)=>checkService(url));

 // 动效工具：尊重“减少动态效果”，浏览器不支持时直接落到最终状态
 function animate(node,frames,opts){if(calm.matches||!node?.animate)return;try{node.animate(frames,opts);}catch{node.animate(frames,{...opts,easing:'ease-out'});}}
 let vtSeq=0;
 function morph(update,kind){
  if(calm.matches||!document.startViewTransition||document.hidden){update();return;}
  const n=++vtSeq;root.dataset.vt=kind||'';
  try{document.startViewTransition(update).finished.finally(()=>{if(n===vtSeq)delete root.dataset.vt;});}catch{update();}
 }
 function slideTo(ind,target,instant){
  if(!ind||!target||!target.offsetWidth)return;
  if(instant)ind.style.transition='none';
  ind.style.width=`${target.offsetWidth}px`;ind.style.height=`${target.offsetHeight}px`;ind.style.transform=`translate(${target.offsetLeft}px,${target.offsetTop}px)`;
  if(instant){ind.offsetWidth;ind.style.transition='';}
 }
 const placeThumbs=instant=>$$('.seg').forEach(s=>slideTo(s.querySelector('.thumb'),s.querySelector('[aria-pressed=true]'),instant));
 const placeFilm=instant=>{const f=$('#film');slideTo(f.querySelector('.film-ind'),f.querySelector('[aria-current=true]'),instant);};

 $('#project').textContent=DATA.project;$('#round').textContent=DATA.round||'';
 $('#brief').textContent=DATA.brief||'';

 function stripMini(c){const s=el('span','strip-mini');(c.palette||[]).forEach(h=>{const i=el('i');i.style.background=h;s.append(i);});return s;}
 function stage(c,interactive){
  const s=el('div','stage');s.dataset.id=c.id;
  const m=document.createElement(c.kind==='image'?'img':'iframe');
  if(c.kind==='image'){m.alt=c.name;m.draggable=false;}
  else{m.title=c.name;m.setAttribute('sandbox',c.kind==='url'?'allow-scripts allow-same-origin allow-forms':c.interactive?'allow-scripts allow-forms':'');m.referrerPolicy='no-referrer';if(!interactive)m.tabIndex=-1;}
  m.addEventListener('load',()=>{if(c.kind==='url'&&services.get(c.content).ready!==true)return;s.classList.add('ready');fit(s);});
  if(c.kind==='image')m.src=c.content;else if(c.kind!=='url')m.srcdoc=c.content;
  s.append(m);
  if(c.kind==='url'){s.append(serviceNotice());syncService(s,c);}
  if(c.kind!=='html'||c.interactive)s.append(el('span','static',c.kind==='url'?t('live'):c.kind==='image'?t('image'):t('interactive')));
  return s;
 }
 function fit(s){
  if(!s.isConnected)return;
  const size=SIZES[st.viewport],m=s.querySelector('iframe,img'),box=s.parentElement;let r;
  if(box.classList.contains('slide')){const cs=getComputedStyle(box),w=box.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),h=narrow()?Infinity:box.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);r=box.dataset.zoom==='actual'?1:Math.min(w/size.w,h/size.h,1);}
  else r=Math.min(box.clientWidth/size.w,1);
  if(!(r>0))return;
  s.style.width=`${size.w*r}px`;s.style.height=`${size.h*r}px`;m.style.width=`${size.w}px`;m.style.height=`${size.h}px`;m.style.transform=`scale(${r})`;
 }
 const fitAll=()=>$$('.stage').forEach(fit),refit=()=>requestAnimationFrame(fitAll);

 function specList(c){
  const dl=el('dl','spec');const row=(k,v)=>{dl.append(el('dt',null,k),el('dd',null,v));};
  row(t('fonts'),c.typography);row(t('traits'),(c.traits||[]).join(' · '));return dl;
 }
 function pickButton(c){const b=el('button','pick');b.type='button';b.dataset.pick=c.id;b.addEventListener('click',()=>choose(c.id));return b;}
 function card(c,i){
  const a=el('article','card');a.dataset.id=c.id;a.style.setProperty('--i',i);a.setAttribute('aria-label',c.name);
  const frame=el('div','frame');frame.style.viewTransitionName=vtName(c);const s=stage(c,false);
  const hit=el('button','hit');hit.type='button';hit.setAttribute('aria-label',t('viewDirection',{name:c.name}));hit.addEventListener('click',()=>setLayout('loupe',c.id));
  s.append(hit);frame.append(s,el('span','pick-mark',t('selected')),el('span','peek',t('peek')));
  const cap=el('div','cap');cap.style.viewTransitionName=`cap-${C.indexOf(c)}`;cap.append(el('span',c.baseline?'no base':'no',no(c)),el('h2','name',c.name),stripMini(c),pickButton(c));
  const lede=el('p','lede',c.concept);lede.title=c.concept;lede.style.viewTransitionName=`lede-${C.indexOf(c)}`;
  a.append(frame,cap,lede);return a;
 }
 function syncCompare(){
  const list=shown(),g=$('#grid'),key=list.map(c=>c.id).join();
  if(key!==gridKey){gridKey=key;g.replaceChildren(...list.map(card));}
  g.dataset.notes=st.notesOn?'on':'off';g.style.setProperty('--cols',Math.min(Math.max(list.length,1),st.viewport==='mobile'?4:3));
  $$('.card .frame').forEach(f=>f.dataset.viewport=st.viewport);
 }

 // 单张查看：所有方向预先排成一条横向轨道，切换时整条轨道滑动，不重新加载画面
 function syncLoupe(dir){
  const list=shown(),key=list.map(c=>c.id).join();if(!list.length)return;
  if(key!==loupeKey){
   loupeKey=key;dir=0;
   $('#track').replaceChildren(...list.map(c=>{const sl=el('div','slide');sl.dataset.id=c.id;sl.append(stage(c,true));return sl;}));
   $('#film').replaceChildren(el('span','film-ind'),...list.map(c=>{const b=el('button');b.type='button';b.dataset.id=c.id;b.append(el('span','fn',no(c)),el('span','ft',c.name),stripMini(c));b.addEventListener('click',()=>go(c.id));return b;}));
  }
  if(!list.some(c=>c.id===st.current))st.current=list[0].id;
  const i=list.findIndex(c=>c.id===st.current),track=$('#track');
  if(!dir)track.style.transition='none';
  track.style.transform=`translateX(${-i*100}%)`;
  if(!dir){track.offsetWidth;track.style.transition='';}
  $$('.slide').forEach(sl=>{const on=sl.dataset.id===st.current;sl.classList.toggle('is-current',on);sl.inert=!on;sl.dataset.zoom=on&&zoomActual?'actual':'fit';sl.firstElementChild.style.viewTransitionName=on?vtName(byId[sl.dataset.id]):'none';});
  $('#prev').disabled=i<=0;$('#next').disabled=i>=list.length-1;
  $$('#film button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===st.current)));
  renderInfo(dir);placeFilm(!dir);
  const cur=$('#film [aria-current=true]'),f=$('#film');
  if(cur&&f.scrollWidth>f.clientWidth)f.scrollTo({left:cur.offsetLeft-16,behavior:calm.matches||!dir?'auto':'smooth'});
 }
 function renderInfo(dir){
  const c=byId[st.current],body=$('#info-body');
  const sw=el('div','big-sw');(c.palette||[]).forEach(h=>{const d=el('div');const x=el('i');x.style.background=h;d.append(x,h.toUpperCase());sw.append(d);});
  const tools=el('div','tools');const z=el('button','tool',zoomActual?t('fit'):t('actual'));z.id='zoom';z.type='button';z.setAttribute('aria-pressed',String(zoomActual));z.addEventListener('click',toggleZoom);tools.append(z);
  const hint=el('p','hint');hint.innerHTML=t('keyboardHint');
  const blocks=[el('span','idx',no(c)),el('h2','name',c.name)];
  if(st.notesOn)blocks.push(el('p','north',c.concept),sw,specList(c));
  blocks.push(pickButton(c),tools,hint,el('p','src',c.kind==='image'?t('imageSource',{source:c.sourceLabel}):c.kind==='url'?t('liveSource',{source:c.sourceLabel}):c.interactive?t('interactiveSource',{source:c.sourceLabel}):t('htmlSource',{source:c.sourceLabel})));
  body.replaceChildren(...blocks);paintChoice();
  if(dir)animate(body,[{opacity:0,transform:`translateX(${dir*18}px)`},{opacity:1,transform:'none'}],{duration:420,easing:ease('glide')});
 }
 function toggleZoom(){
  morph(()=>{zoomActual=!zoomActual;const sl=$('.slide.is-current');sl.dataset.zoom=zoomActual?'actual':'fit';fitAll();sl.scrollTo(0,0);const z=$('#zoom');z.textContent=zoomActual?t('fit'):t('actual');z.setAttribute('aria-pressed',String(zoomActual));},'reshape');
 }

 function render(){
  const list=shown(),loupe=st.layout==='loupe'&&list.length>0;
  $('#compare-view').hidden=st.layout!=='compare'||!list.length;$('#loupe').hidden=!loupe;$('#none').hidden=list.length>0;
  syncCompare();syncLoupe(0);
  $$('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===st.layout)));
  $$('[data-viewport]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.viewport===st.viewport)));
  placeThumbs(false);placeFilm(true);
  $('#notes-toggle').checked=st.notesOn;
  $('#filter-summary').textContent=t('filterCount',{shown:list.length,total:C.length});
  $$('#filter-list input').forEach(i=>i.checked=st.visible.includes(i.value));
  paintChoice();fitAll();
 }
 function setLayout(layout,id){
  if(layout===st.layout&&!(id&&id!==st.current))return;
  if(layout==='loupe'&&st.layout==='compare')compareScroll=scrollY;
  if(id)st.current=id;st.layout=layout;zoomActual=false;save();
  morph(()=>{
   render();
   if(layout==='loupe'){window.scrollTo(0,0);return;}
   window.scrollTo(0,compareScroll);
   const a=$(`.card[data-id="${CSS.escape(st.current)}"]`),r=a?.getBoundingClientRect();
   if(r&&(r.top<60||r.bottom>innerHeight))a.scrollIntoView({block:'center'});
  });
 }
 function go(id){
  const list=shown(),from=list.findIndex(c=>c.id===st.current),to=list.findIndex(c=>c.id===id);
  if(to<0||to===from)return;
  st.current=id;zoomActual=false;save();syncLoupe(Math.sign(to-from));fitAll();
 }
 function step(d){const list=shown(),i=list.findIndex(c=>c.id===st.current),n=list[i+d];if(n)go(n.id);else nudge(d);}
 function nudge(d){animate($('.slide.is-current .stage'),[{transform:'none'},{transform:`translateX(${d*14}px)`},{transform:'none'}],{duration:320,easing:'ease-out'});}

 // 选择即复制：再次点击“已选择”会带上最新备注重新复制，不再有单独的复制按钮
 function choose(id){
  const fresh=st.chosen!==id;st.chosen=id;save();paintChoice();
  if(fresh){
   animate($(`.card[data-id="${CSS.escape(id)}"] .pick-mark`),[{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1)'}],{duration:500,easing:ease('pop')});
   animate($('#decide-name'),[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:380,easing:ease('glide')});
   animate($('#choice-chip'),[{transform:'scale(.3)'},{transform:'scale(1)'}],{duration:500,easing:ease('pop')});
  }
  copy();
 }
 function paintChoice(){
  $$('.card').forEach(a=>a.classList.toggle('is-chosen',a.dataset.id===st.chosen));
  $$('[data-pick]').forEach(b=>{const on=b.dataset.pick===st.chosen,short=!!b.closest('.cap');b.replaceChildren(document.createTextNode(on?(short?t('selected'):t('selectedCopy')):(short?t('select'):t('selectDirection'))));if(!short)b.append(el('kbd',null,'P'));b.toggleAttribute('data-on',on);b.title=on?t('recopyTitle'):t('selectTitle');});
  $$('#film button').forEach(b=>b.querySelector('.ft').classList.toggle('chosen',b.dataset.id===st.chosen));
  const c=byId[st.chosen];$('#decide-name').textContent=c?`${no(c)} ${c.name}`:t('noChoice');$('#picked').classList.toggle('on',!!c);
  const chip=$('#choice-chip'),next=c?stripMini(c):el('span','choice-empty');next.id='choice-chip';chip.replaceWith(next);
  status();
 }
 function status(){$('#notes-open').textContent=st.notes?t('notesEdited'):t('notes');const s=$('#state');if(!stored){s.textContent=t('storageUnavailable');s.dataset.warn='';}else{s.textContent=t('notesHelp');delete s.dataset.warn;}}
 function copyText(){const c=byId[st.chosen];let text=t('copyChoice',{round:DATA.round?t('copyRound',{round:DATA.round}):'',number:no(c),name:c.name});if(st.notes.trim())text+=t('copyNotes',{notes:st.notes.trim()});return text;}
 async function copy(t=copyText()){
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true;}catch{const a=el('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;opacity:0';document.body.append(a);a.select();try{ok=document.execCommand('copy');}catch{}a.remove();}
  toast(ok,t);
 }
 function toast(ok,text){
  const n=$('#toast');n.toggleAttribute('data-fail',!ok);n.querySelector('b').textContent=ok?t('copied'):t('copyFailed');n.querySelector('code').textContent=ok?text.replace(/\n/g,' · '):text;
  n.classList.remove('show');n.offsetWidth;n.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('show'),ok?2400:8000);
 }

 const fl=$('#filter-list');
 C.forEach(c=>{const l=el('label'),i=el('input');i.type='checkbox';i.value=c.id;i.addEventListener('change',()=>{st.visible=C.map(x=>x.id).filter(id=>id===c.id?i.checked:st.visible.includes(id));save();morph(render,'reshape');});l.append(i,el('span','n',no(c)),c.name);fl.append(l);});
 $('#show-all').addEventListener('click',()=>{st.visible=C.map(c=>c.id);save();morph(render,'reshape');});
 $$('button[data-layout]').forEach(b=>b.addEventListener('click',()=>setLayout(b.dataset.layout)));
 $$('button[data-viewport]').forEach(b=>b.addEventListener('click',()=>{if(st.viewport===b.dataset.viewport)return;st.viewport=b.dataset.viewport;save();morph(render,'reshape');}));
 $('#notes-toggle').addEventListener('change',e=>{st.notesOn=e.target.checked;save();morph(render,'reshape');});
 $('#prev').addEventListener('click',()=>step(-1));$('#next').addEventListener('click',()=>step(1));
 document.addEventListener('keydown',e=>{
  if(e.target.closest?.('textarea,input,summary')||e.metaKey||e.ctrlKey||e.altKey||st.layout!=='loupe')return;
  if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);else if(e.key==='Escape')setLayout('compare');else if(e.key.toLowerCase()==='p')choose(st.current);
 });
 const notes=$('#notes');notes.value=st.notes||'';
 notes.addEventListener('input',()=>{st.notes=notes.value;save();status();});
 $('#notes-open').parentElement.addEventListener('toggle',e=>{if(e.target.open)notes.focus();});
 function syncBars(){root.style.setProperty('--bar-h',`${$('#bar').offsetHeight}px`);placeThumbs(true);placeFilm(true);refit();}
 window.addEventListener('resize',syncBars,{passive:true});
 document.fonts?.ready.then(()=>{placeThumbs(true);placeFilm(true);});
 $('#bar').hidden=false;
 if(st.layout==='compare'){$('#grid').classList.add('first');$('.intro').classList.add('first');setTimeout(()=>{$('#grid').classList.remove('first');$('.intro').classList.remove('first');},1400);}
 render();syncBars();
 if(services.size){checkServices();setInterval(()=>{if(!document.hidden)checkServices();},5000);window.addEventListener('focus',checkServices);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkServices();});}
})();
</script></body></html>
