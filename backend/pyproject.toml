[project]
name = "testforge"
version = "0.1.0"
description = "TestForge · AI 测试用例生成平台（需求是源头，知识预编译，AI 生成用例，沙箱验证闭环，全链路可回溯）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "grpcio>=1.62",
    "grpcio-tools>=1.62",
    "protobuf>=4.25",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "python-docx>=1.1",
    "markdown-it-py>=3.0",
    # py-tree-sitter 已在 PyPI 改名 tree-sitter；语言集合用维护中的 tree-sitter-language-pack
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=1.0",
    "networkx>=3.3",
    "docker>=7.0",
    "redis>=5.0",
    "python-multipart>=0.0.9",
    "deepagents>=0.7.15",
    "langchain-deepseek>=1.1.0",
    "websockets==16.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "needs_asyncio: 依赖事件循环的用例（TestClient/uvicorn）；主机 asyncio 不可用时自动跳过",
]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["services/shared/gen", "frontend", "prototype"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["services/shared/gen", "frontend", "prototype", "scripts"]
check_untyped_defs = true
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = ["services.shared.gen.*"]
follow_imports = "skip"
ignore_errors = true
