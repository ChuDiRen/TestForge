# Schemathesis 契约测试配置：token 从环境变量注入（ST_TOKEN），不落盘。
headers = { Authorization = "Bearer ${ST_TOKEN}" }
request-timeout = 20.0

[generation]
max-examples = 50

# 正例空间天然含语义拒绝的操作：状态机转换边校验（400 非法流转）、
# 远端 git 不可达（502）、上传内容本身不可处理（垃圾 zip/不支持类型）。
# 400/422 之外的响应（尤其 5XX）仍然按缺陷报。
[[operations]]
include-name = "POST /api/defects/{defect_id}/status"
checks.positive_data_acceptance.expected-statuses = ["2XX", "4XX"]

[[operations]]
include-name = "POST /api/repos/create"
checks.positive_data_acceptance.expected-statuses = ["2XX", "4XX"]

[[operations]]
include-name = "POST /api/repos/upload"
checks.positive_data_acceptance.expected-statuses = ["2XX", "4XX"]

[[operations]]
include-name = "POST /api/kg/documents/upload"
checks.positive_data_acceptance.expected-statuses = ["2XX", "4XX"]

[[operations]]
include-name = "POST /api/knowledge/assets/upload"
checks.positive_data_acceptance.expected-statuses = ["2XX", "4XX"]

[[operations]]
# 知识质量门（评估分 <0.5 拒绝入库）是设计语义，正例空间必然包含低质内容 → 422
include-name = "POST /api/knowledge/documents/create"
checks.positive_data_acceptance.expected-statuses = ["2XX", "4XX"]
